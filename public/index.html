<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d10">
<title>IOL &mdash; Heading Sender</title>
<style>
  :root {
    --bg: #0d0d10;
    --fg: #e8e6e1;
    --dim: #8a8a93;
    --accent: #4cc2ff;
    --bad: #ff6b5e;
    --good: #6bd88a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  main {
    min-height: 100%;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  h1 { font-size: 15px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); margin: 0; font-weight: 500; }

  .dial { position: relative; width: min(78vw, 320px); aspect-ratio: 1; }
  .dial svg { width: 100%; height: 100%; }
  .needle { transform-box: fill-box; transform-origin: 50% 50%; transition: transform .08s linear; }

  .readout { font-size: 44px; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .readout small { font-size: 18px; color: var(--dim); }
  .cardinal { letter-spacing: .3em; color: var(--accent); font-size: 18px; }

  .row { display: flex; gap: 10px; width: 100%; max-width: 380px; }
  input, button {
    font: inherit; border-radius: 10px; border: 1px solid #2a2a31;
    background: #16161b; color: var(--fg); padding: 12px 14px;
  }
  input { flex: 1; min-width: 0; }
  button { flex: 1; font-weight: 600; }
  button.primary { background: var(--accent); color: #041019; border-color: transparent; }
  button:disabled { opacity: .45; }

  .status { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }
  .dot.on { background: var(--good); }

  .log {
    width: 100%; max-width: 380px; min-height: 88px; margin-top: auto;
    background: #111116; border: 1px solid #22222a; border-radius: 10px;
    padding: 10px 12px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--dim); white-space: pre-wrap; word-break: break-word;
  }
  .note { color: var(--dim); font-size: 12px; text-align: center; max-width: 380px; }
</style>
</head>
<body>
<main>
  <h1>Heading Sender</h1>

  <div class="dial">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <circle cx="100" cy="100" r="92" fill="none" stroke="#22222a" stroke-width="2"/>
      <circle cx="100" cy="100" r="72" fill="none" stroke="#181820" stroke-width="1"/>
      <g fill="#5c5c67" font-size="12" text-anchor="middle" font-family="inherit">
        <text x="100" y="26">N</text>
        <text x="178" y="105">E</text>
        <text x="100" y="186">S</text>
        <text x="22" y="105">W</text>
      </g>
      <g id="needle" class="needle">
        <polygon points="100,28 110,112 100,102 90,112" fill="#4cc2ff"/>
        <polygon points="100,172 110,88 100,98 90,88" fill="#33333c"/>
      </g>
      <circle cx="100" cy="100" r="4" fill="#e8e6e1"/>
    </svg>
  </div>

  <div style="text-align:center">
    <div class="readout"><span id="deg">---</span><small>&deg;</small></div>
    <div class="cardinal" id="cardinal">&mdash;</div>
  </div>

  <div class="row">
    <input id="room" placeholder="room code" autocomplete="off" autocapitalize="off" spellcheck="false" value="default">
  </div>

  <div class="row">
    <button id="start" class="primary">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>

  <div class="status"><span class="dot" id="dot"></span><span id="state">idle</span></div>
  <p class="note">Hold the phone flat, screen up. Point the top edge the way you are facing.</p>

  <div class="log" id="log"></div>
</main>

<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const els = {
    deg: $('deg'), cardinal: $('cardinal'), needle: $('needle'),
    room: $('room'), start: $('start'), stop: $('stop'),
    dot: $('dot'), state: $('state'), log: $('log')
  };

  const SEND_HZ = 20;
  const CARDINALS = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];

  let socket = null;
  let running = false;
  let latest = null;       // { heading, pitch, roll, absolute }
  let lastSent = 0;
  let sendTimer = null;
  let reconnectTimer = null;

  function log(msg) {
    const time = new Date().toLocaleTimeString();
    els.log.textContent = `${time}  ${msg}\n` + els.log.textContent.split('\n').slice(0, 5).join('\n');
  }

  function setState(text, connected) {
    els.state.textContent = text;
    els.dot.classList.toggle('on', !!connected);
  }

  // ------------------------------------------------------------- orientation

  // Compensates for the phone being held in landscape / upside down.
  function screenAngle() {
    if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
    return window.orientation || 0;
  }

  function onOrientation(e) {
    let heading = null;
    let absolute = false;

    if (typeof e.webkitCompassHeading === 'number' && !Number.isNaN(e.webkitCompassHeading)) {
      // iOS: already a true-north compass heading, clockwise.
      heading = e.webkitCompassHeading;
      absolute = true;
    } else if (typeof e.alpha === 'number') {
      // Spec: alpha is counter-clockwise from north, so invert it.
      heading = 360 - e.alpha;
      absolute = e.absolute === true || e.type === 'deviceorientationabsolute';
    }

    if (heading === null) return;

    heading = (heading + screenAngle()) % 360;
    if (heading < 0) heading += 360;

    latest = {
      heading,
      pitch: typeof e.beta === 'number' ? e.beta : 0,
      roll: typeof e.gamma === 'number' ? e.gamma : 0,
      absolute
    };

    render(latest);
  }

  function render(d) {
    els.deg.textContent = d.heading.toFixed(0).padStart(3, '0');
    els.cardinal.textContent = CARDINALS[Math.round(d.heading / 45) % 8];
    els.needle.style.transform = `rotate(${-d.heading}deg)`;
  }

  async function requestOrientationPermission() {
    const needsPermission =
      typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function';

    if (!needsPermission) return true;

    // iOS 13+: must be called from inside a user gesture.
    const result = await DeviceOrientationEvent.requestPermission();
    if (result !== 'granted') {
      log('motion permission denied');
      return false;
    }
    return true;
  }

  function attachOrientation() {
    // deviceorientationabsolute is the compass-referenced event on Android.
    window.addEventListener('deviceorientationabsolute', onOrientation, true);
    window.addEventListener('deviceorientation', onOrientation, true);
  }

  function detachOrientation() {
    window.removeEventListener('deviceorientationabsolute', onOrientation, true);
    window.removeEventListener('deviceorientation', onOrientation, true);
  }

  // --------------------------------------------------------------- websocket

  function socketUrl() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const room = encodeURIComponent(els.room.value.trim() || 'default');
    return `${proto}//${location.host}/ws?room=${room}&role=phone`;
  }

  function connect() {
    clearTimeout(reconnectTimer);
    setState('connecting…', false);

    socket = new WebSocket(socketUrl());

    socket.onopen = () => {
      setState(`connected · ${els.room.value.trim() || 'default'}`, true);
      log('websocket open');
    };

    socket.onmessage = (ev) => {
      try {
        const msg = JSON.parse(ev.data);
        if (msg.type === 'welcome') log(`joined "${msg.room}" · ${msg.peers} listener(s)`);
        if (msg.type === 'peers') log(`${msg.count - 1} listener(s)`);
      } catch { /* ignore */ }
    };

    socket.onclose = () => {
      setState('disconnected', false);
      if (running) {
        log('reconnecting in 2s');
        reconnectTimer = setTimeout(connect, 2000);
      }
    };

    socket.onerror = () => log('websocket error');
  }

  function pump() {
    if (!latest || !socket || socket.readyState !== WebSocket.OPEN) return;
    const now = performance.now();
    if (now - lastSent < 1000 / SEND_HZ) return;
    lastSent = now;
    socket.send(JSON.stringify({ type: 'heading', ...latest }));
  }

  // ------------------------------------------------------------------- start

  els.start.addEventListener('click', async () => {
    if (running) return;

    if (!(await requestOrientationPermission())) {
      setState('permission denied', false);
      return;
    }

    if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
      log('warning: orientation needs https on phones');
    }

    running = true;
    els.start.disabled = true;
    els.stop.disabled = false;
    els.room.disabled = true;

    attachOrientation();
    connect();
    sendTimer = setInterval(pump, 1000 / SEND_HZ / 2);

    // Keep the screen awake while streaming, if the browser allows it.
    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen').catch(() => {});
    }
  });

  els.stop.addEventListener('click', () => {
    running = false;
    els.start.disabled = false;
    els.stop.disabled = true;
    els.room.disabled = false;

    detachOrientation();
    clearInterval(sendTimer);
    clearTimeout(reconnectTimer);
    if (socket) socket.close();
    setState('idle', false);
  });

  // Restore the room code between visits.
  const saved = localStorage.getItem('iol.room');
  if (saved) els.room.value = saved;
  els.room.addEventListener('change', () => localStorage.setItem('iol.room', els.room.value.trim()));
})();
</script>
</body>
</html>
